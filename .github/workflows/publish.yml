name: publish

on:
  workflow_dispatch:

permissions: write-all

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@master
        with:
          context: .
          push: false
          tags: demo-checkout:latest
